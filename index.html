<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>404 - Page Not Found</title>

    <style>
        /* RESET */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: Arial, sans-serif;
            background: #080d17;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */

        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 22px 8%;
            border-bottom: 1px solid #263044;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
        }

        .logo span {
            color: #38bdf8;
        }

        nav a {
            text-decoration: none;
            color: #cbd5e1;
            font-size: 14px;
        }

        nav a:hover {
            color: #38bdf8;
        }

        /* MAIN CONTENT */

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 50px 20px;
        }

        .container {
            max-width: 600px;
            width: 100%;
        }

        .error-code {
            font-size: clamp(110px, 25vw, 190px);
            font-weight: 900;
            line-height: 1;
            letter-spacing: -8px;
            color: #38bdf8;
            text-shadow: 0 0 40px #38bdf855;
        }

        .tag {
            color: #38bdf8;
            font-size: 12px;
            font-weight: bold;
            letter-spacing: 4px;
            margin-top: 25px;
        }

        h1 {
            font-size: clamp(25px, 5vw, 38px);
            margin: 15px 0;
        }

        .description {
            color: #94a3b8;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 30px;
        }

        /* SEARCH BOX */

        .search-box {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
        }

        .search-box input {
            flex: 1;
            min-width: 0;
            padding: 15px;
            border: 1px solid #334155;
            border-radius: 8px;
            background: #111c2e;
            color: white;
            font-size: 14px;
            outline: none;
        }

        .search-box input:focus {
            border-color: #38bdf8;
        }

        .search-box button {
            padding: 15px 20px;
            background: #38bdf8;
            color: #080d17;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .search-box button:hover {
            background: white;
            transform: translateY(-2px);
        }

        /* HOME BUTTON */

        .home-button {
            display: inline-block;
            padding: 13px 23px;
            border: 1px solid #334155;
            border-radius: 8px;
            text-decoration: none;
            color: white;
            transition: 0.3s;
        }

        .home-button:hover {
            background: #172337;
            border-color: #38bdf8;
        }

        /* FOOTER */

        footer {
            text-align: center;
            padding: 22px;
            border-top: 1px solid #263044;
            color: #64748b;
            font-size: 12px;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 450px) {
            nav {
                padding: 20px;
            }

            .search-box {
                flex-direction: column;
            }

            .search-box button {
                width: 100%;
            }

            .error-code {
                letter-spacing: -4px;
            }
        }

    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav>
        <div class="logo">MY<span>SITE.</span></div>
        <a href="/">Home</a>
    </nav>


    <!-- 404 PAGE -->

    <main>

        <div class="container">

            <div class="error-code">404</div>

            <p class="tag">ERROR — PAGE NOT FOUND</p>

            <h1>Oops! You are lost.</h1>

            <p class="description">
                The page you are looking for doesn't exist,
                may have been moved, or the URL might be incorrect.
            </p>

            <form class="search-box" action="/" method="get">

                <input
                    type="search"
                    name="q"
                    placeholder="Search for something..."
                    aria-label="Search"
                    required
                >

                <button type="submit">Search</button>

            </form>

            <a href="/" class="home-button">
                ← Back to Homepage
            </a>

        </div>

    </main>


    <!-- FOOTER -->

    <footer>
        © 2026 MySite. All rights reserved.
        <br><br>
        Error Code: 404
    </footer>

</body>
</html>
