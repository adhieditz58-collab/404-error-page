<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>No Internet</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #202124;
    color: #9aa0a6;
    font-family: Arial, sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
}
    a {
    text-decoration: none;
    color: black;
    }

.container {
    width: 100%;
    max-width: 600px;
    padding: 30px;
    margin-top: 170px;
}

/* Dinosaur */

.dino {
    font-size: 65px;
    margin-bottom: 35px;
    display: inline-block;
    cursor: pointer;
    filter: grayscale(1);
    user-select: none;
}

h1 {
    font-size: 30px;
    font-weight: 500;
    margin-bottom: 25px;
    color: #9aa0a6;
}

p {
    font-size: 18px;
    margin-bottom: 12px;
}

ul {
    padding-left: 38px;
    margin-bottom: 28px;
}

li {
    font-size: 18px;
    line-height: 1.6;
    padding-left: 2px;
}

.error {
    font-size: 14px;
    margin-bottom: 12px;
}

.load {
    color: #8ab4f8;
    font-size: 16px;
    font-weight: bold;
    margin-bottom: 25px;
    cursor: pointer;
}

.notice {
    border: 1px solid #777;
    border-radius: 7px;
    padding: 20px;
    font-size: 16px;
    line-height: 1.8;
}

.cancel {
    color: #8ab4f8;
    cursor: pointer;
}

@keyframes jump {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-35px); }
}

.jump {
    animation: jump 0.4s ease;
}

@media (max-width: 480px) {
    .container {
        padding: 25px;
        margin-top: 160px;
    }

    h1 {
        font-size: 25px;
    }

    p, li {
        font-size: 16px;
    }

    .dino {
        font-size: 55px;
    }
}
</style>
</head>

<body>

<div class="container">

    <div class="dino" id="dino" title="Tap to play">🦖</div>

    <h1 id="heading">No internet connection</h1>

    <p>Try:</p>

    <ul>
        <li>Checking the network cables, modem and router</li>
        <li>Reconnecting to Wi-Fi</li>
        <li>Checking your internet connection</li>
    </ul>

    <div class="error">ERR_INTERNET_DISCONNECTED</div>

    <div class="load" onclick="retry()">
        ↓ &nbsp; RELOAD PAGE
    </div>

    <div class="notice" id="notice">
        This page isn't available because your <a href="notfound.html">dev</a>ice appears to be offline.
        <span class="cancel" onclick="dismiss()"> Cancel</span>
    </div>

</div>

<script>
const dino = document.getElementById("dino");
const heading = document.getElementById("heading");

dino.addEventListener("click", function () {
    dino.classList.remove("jump");
    void dino.offsetWidth;
    dino.classList.add("jump");

    heading.textContent = "Let's play!";
});

function retry() {
    if (navigator.onLine) {
        location.reload();
    } else {
        heading.textContent = "No internet connection";
    }
}

function dismiss() {
    document.getElementById("notice").style.display = "none";
}
</script>

</body>
</html>
